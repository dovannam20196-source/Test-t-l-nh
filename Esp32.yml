name: Build ESP32-S3
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          sudo apt-get update && sudo apt-get install -y python3-serial
          URL1="https://espressif.github.io"
          URL2="/arduino-esp32/package_esp32_index.json"
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls "${URL1}${URL2}"
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          INO_PATH=$(find . -name "*.ino" | head -n 1)
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --export-binaries "$INO_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: "**/*.bin"
          
